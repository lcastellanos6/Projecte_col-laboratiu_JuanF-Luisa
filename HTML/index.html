<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre de Parcel·les</title>
</head>
<body>
    <h1>Registre de Parcel·les</h1>
   <form action="guardar_parcela.php" method="post">
    <label>Nom descriptiu:</label>
    <input type="text" name="Nom_descriptiu" required><br><br>

    <label>Referència cadastral:</label>
    <input type="text" name="ref_cadastral" required><br><br>

    <label>Superfície total (ha):</label>
    <input type="number" step="0.01" name="superficie_total"><br><br>

    <label>Pendent (%):</label>
    <input type="number" step="0.01" name="pendent"><br><br>

    <label>Orientació:</label>
    <select name="orientacio" required>
    <option value="nord">Nord</option>
    <option value="sud">Sud</option>
    <option value="est">Est</option>
    <option value="oest">Oest</option>
    </select><br><br>
 
    <label>Kilometratge (longitud del perímetre o dades GPS):</label>
    <textarea name="Kilometratge"></textarea><br><br>


    <label>Localització geoespacial (GeoJSON o KML):</label>
    <textarea name="localitzacio_geo"></textarea><br><br>

     <label>Documentació:</label>
    <textarea name="documentacio"></textarea><br><br>

    <label>Característiques edafològiques:</label>
    <textarea name="caracteristiques_edafo"></textarea><br><br>

    <button type="submit">Guardar Parcel·la</button>
</form>

</body>
</html>
