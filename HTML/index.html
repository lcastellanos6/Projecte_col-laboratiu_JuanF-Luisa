 document.addEventListener('DOMContentLoaded', function() {
     var sectionHeaders = document.querySelectorAll('.menu-section-header');
     sectionHeaders.forEach(function(header) {
         header.addEventListener('click', function() {
             var section = header.closest('.menu-section');
             if (section) {
                 section.classList.toggle('is-open');
             }
         });
     });

     var toggleButton = document.getElementById('menuToggle');
     var appShell = document.querySelector('.app-shell');

     if (toggleButton && appShell) {
         var syncToggleState = function() {
             var isCollapsed = appShell.classList.contains('sidebar-collapsed');
             toggleButton.setAttribute('aria-expanded', isCollapsed ? 'false' : 'true');
         };

         syncToggleState();

         toggleButton.addEventListener('click', function() {
             appShell.classList.toggle('sidebar-collapsed');
             syncToggleState();
         });

         document.addEventListener('keydown', function(event) {
             if (event.key === 'Escape') {
                 appShell.classList.add('sidebar-collapsed');
                 syncToggleState();
             }
         });
     }
 });
