<script>
function openPage(url) {
    document.getElementById("contentFrame").src = url;
}

document.addEventListener('DOMContentLoaded', function() {
    var sectionHeaders = document.querySelectorAll('.menu-section-header');
    sectionHeaders.forEach(function(header) {
        header.addEventListener('click', function() {
            var section = header.closest('.menu-section');
            if (section) {
                section.classList.toggle('is-open');
            }
        });
    });

    var dropdown = document.getElementById('dashboardDropdown');
    var toggleButton = document.getElementById('menuToggle');
    var heroElement = document.querySelector('.hero');

    if (dropdown && toggleButton && heroElement) {
        var menuSections = dropdown.querySelectorAll('.menu-section');

        var reposition = function() {
            var rect = heroElement.getBoundingClientRect();
            dropdown.style.setProperty('--dropdown-top', rect.bottom + window.scrollY + 10 + 'px');
        };

        var syncPosition = function() {
            if (dropdown.classList.contains('is-visible')) {
                reposition();
            }
        };

        var outsideClickHandler = function(event) {
            if (!dropdown.contains(event.target) && !toggleButton.contains(event.target)) {
                closeDropdown();
            }
        };

        var keyHandler = function(event) {
            if (event.key === 'Escape') {
                closeDropdown();
            }
        };

        var resetSections = function() {
            menuSections.forEach(function(section) {
                section.classList.remove('is-open');
            });
        };

        var openDropdown = function() {
            reposition();
            resetSections();
            dropdown.classList.add('is-visible');
            dropdown.setAttribute('aria-hidden', 'false');
            toggleButton.setAttribute('aria-expanded', 'true');
            document.addEventListener('click', outsideClickHandler);
            document.addEventListener('keydown', keyHandler);
            window.addEventListener('resize', syncPosition);
            window.addEventListener('scroll', syncPosition);
        };

        var closeDropdown = function() {
            dropdown.classList.remove('is-visible');
            dropdown.setAttribute('aria-hidden', 'true');
            toggleButton.setAttribute('aria-expanded', 'false');
            document.removeEventListener('click', outsideClickHandler);
            document.removeEventListener('keydown', keyHandler);
            window.removeEventListener('resize', syncPosition);
            window.removeEventListener('scroll', syncPosition);
        };

        toggleButton.addEventListener('click', function(event) {
            event.stopPropagation();
            if (dropdown.classList.contains('is-visible')) {
                closeDropdown();
            } else {
                openDropdown();
            }
        });

        var actionButtons = dropdown.querySelectorAll('.menu-section-body button');
        actionButtons.forEach(function(button) {
            button.addEventListener('click', closeDropdown);
        });
    }
});
</script>
