<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Registre del tipus de sòl</title>
<link rel="stylesheet" href="styles.css">



input, select, 
button { margin-top:15px; background:#2f7d2f; color:white; padding:10px; border:none;
         border-radius:5px; cursor:pointer; width:100%; }

</style>
</head>
<body>

<h2>Registre del tipus de sòl</h2>

<form action="../PHP/guardar_sol.php" method="post">
    
    <label>Tipus de sòl *</label>
    <input type="text" name="tipus" required>

    <label>pH</label>
    <input type="number" step="0.01" name="ph">

    <label>Matèria orgànica (%)</label>
    <input type="number" step="0.01" name="materia_organica">

    <label>Observacions</label>
    <textarea name="observacions"></textarea>

    <button type="submit">Guardar sòl</button>
</form>

</body>
</html>
