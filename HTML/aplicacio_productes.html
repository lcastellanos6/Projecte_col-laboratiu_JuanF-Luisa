<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Afegir Producte a Aplicació</title>
<style>
body { font-family: Arial, sans-serif; background:#f5fff5; padding:20px; }
form { background:white; padding:20px; border-radius:8px; max-width:500px; margin:auto;
       box-shadow:0 2px 6px rgba(0,0,0,0.1); }
label { font-weight:bold; margin-top:10px; display:block; }
input, textarea, button { width:100%; padding:8px; margin-top:5px; border-radius:4px; border:1px solid #ccc; }
button { margin-top:15px; background:#2f7d2f; color:white; padding:10px; border:none;
         border-radius:5px; cursor:pointer; width:100%; }
button:hover { background:#3d9b3d; }
</style>
</head>
<body>

    <h2>Afegir Producte Utilitzat en una Aplicació</h2>

    <form action="../PHP/guardar_aplicacio_productes.php" method="post">

        <label>ID Aplicació *</label>
        <input type="number" name="id_aplicacio" required>

        <label>ID Producte *</label>
        <input type="number" name="id_producte" required>

        <label>Quantitat *</label>
        <input type="number" step="0.001" name="quantitat" required>

        <label>Unitat *</label>
        <select name="unitat" required>
            <option value="L">L</option>
            <option value="mL">mL</option>
            <option value="kg">kg</option>
            <option value="g">g</option>
        </select>

        <label>Concentració</label>
        <input type="text" name="concentracio">

        <label>Lot / Referència</label>
        <input type="text" name="lot_referencia">

        <button type="submit">Guardar Producte</button>

    </form>

</body>
</html>
