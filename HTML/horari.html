<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Registrar Horari Model</title>
<style>
body { font-family: Arial, sans-serif; background:#f5fff5; padding:20px; }
form { background:white; padding:20px; border-radius:8px; max-width:500px; margin:auto;
       box-shadow:0 2px 6px rgba(0,0,0,0.1); }
label { font-weight:bold; margin-top:10px; display:block; }
input, select, button { width:100%; padding:8px; margin-top:5px; border-radius:4px; border:1px solid #ccc; }
button { margin-top:15px; background:#2f7d2f; color:white; padding:10px; border:none;
         border-radius:5px; cursor:pointer; width:100%; }
button:hover { background:#3d9b3d; }
</style>
</head>
<body>

<h1>Registrar Nou Horari Model</h1>

<form action="../PHP/guardar_horari.php" method="post">
    <label>Nom de l'horari:</label>
    <input type="text" name="nom" required>

    <label>Descripció:</label>
    <textarea name="descripcio"></textarea>

    <label>Hora d'inici:</label>
    <input type="time" name="hora_inici">

    <label>Hora de fi:</label>
    <input type="time" name="hora_fi">

    <label>Pausa en minuts:</label>
    <input type="number" name="pausa_minuts" min="0" value="0">

    <button type="submit">Guardar Horari</button>
</form>

</body>
</html>
