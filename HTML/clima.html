<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Registre Climàtic</title>
<style>
body { font-family: Arial, sans-serif; background:#f5fff5; padding:20px; }
form { background:white; padding:20px; border-radius:8px; max-width:500px; margin:auto;
       box-shadow:0 2px 6px rgba(0,0,0,0.1); }
label { font-weight:bold; margin-top:10px; display:block; }
input, select, button { width:100%; padding:8px; margin-top:5px; border-radius:4px; border:1px solid #ccc; }
button { margin-top:15px; background:#2f7d2f; color:white; padding:10px; border:none;
         border-radius:5px; cursor:pointer; width:100%; }
button:hover { background:#3d9b3d; }
</style>
</head>

<body>

<h2>Afegir Registre Climàtic</h2>

<form action="../PHP/guardar_clima.php" method="post">

    <label>ID Plantació *</label>
    <input type="number" name="id_plantacio" required>

    <label>Any *</label>
    <input type="number" name="any_temp" required>

    <label>Temperatura mitjana (°C)</label>
    <input type="number" step="0.01" name="temperatura_mitjana">

    <label>Precipitació total (mm)</label>
    <input type="number" step="0.01" name="precipitacio_total">

    <label>Altres factors climàtics</label>
    <textarea name="altres_factors"></textarea>

    <button type="submit">Guardar registre</button>
</form>

</body>
</html>
