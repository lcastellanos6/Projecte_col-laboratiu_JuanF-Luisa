<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Assignar Treballador a Equip</title>
<link rel="stylesheet" href="styles.css">



input, 
button { margin-top:15px; background:#2f7d2f; color:white; padding:10px; border:none;
         border-radius:5px; cursor:pointer; width:100%; }

</style>
</head>
<body>

<h2>Assignar Treballador a Equip</h2>

<form action="../PHP/guardar_membres.php" method="POST">

    <label for="id_equip">ID Equip</label>
    <input type="number" name="id_equip" required placeholder="Escriu l'ID de l'equip">

    <label for="id_treballador">ID Treballador</label>
    <input type="number" name="id_treballador" required placeholder="Escriu l'ID del treballador">

    <label for="rol_equip">Rol a l'equip</label>
    <input type="text" name="rol_equip" placeholder="Ex: Cap de plantació">

    <label for="data_alta">Data d'alta</label>
    <input type="date" name="data_alta">

    <label for="data_baixa">Data de baixa</label>
    <input type="date" name="data_baixa">

    <button type="submit">Assignar Treballador</button>

</form>

</body>
</html>
