<form action="../PHP/guardar_membres.php" method="POST">

    <label for="id_equip">Equip</label>
    <select name="id_equip" required>
        <option value="">--Selecciona un equip--</option>
        <?php
        $conn = new mysqli("localhost","root","","web");
        if($conn->connect_error) die("Error de connexió: ".$conn->connect_error);
        $result = $conn->query("SELECT id_equip, nom FROM equip ORDER BY nom");
        while($row = $result->fetch_assoc()){
            echo "<option value='".htmlspecialchars($row['id_equip'])."'>".htmlspecialchars($row['nom'])."</option>";
        }
        $conn->close();
        ?>
    </select>

    <label for="id_treballador">Treballador</label>
    <select name="id_treballador" required>
        <option value="">--Selecciona un treballador--</option>
        <?php
        $conn = new mysqli("localhost","root","","web");
        if($conn->connect_error) die("Error de connexió: ".$conn->connect_error);
        $result = $conn->query("SELECT id_treballador, nom_complet FROM treballador ORDER BY nom_complet");
        while($row = $result->fetch_assoc()){
            echo "<option value='".htmlspecialchars($row['id_treballador'])."'>".htmlspecialchars($row['nom_complet'])."</option>";
        }
        $conn->close();
        ?>
    </select>

    <label for="rol_equip">Rol a l'equip</label>
    <input type="text" name="rol_equip">

    <label for="data_alta">Data d'alta</label>
    <input type="date" name="data_alta">

    <label for="data_baixa">Data de baixa</label>
    <input type="date" name="data_baixa">

    <button type="submit">Assignar Treballador</button>

</form>
