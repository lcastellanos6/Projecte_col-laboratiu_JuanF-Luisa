<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Registre de Sector</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">
    <div class="page-header">
  <h1>Registrar nou sector</h1>
</div>

    <div class="panel">
<form action="../PHP/guardar_sector.php" method="post" id="sectorForm">

        <label>Nom del sector:</label>
        <input type="text" name="nom" required>

        <label>Superfície (ha):</label>
        <input type="number" name="superficie" step="0.01">

        <label>Geometria GeoJSON:</label>
        <textarea name="geometria_geojson" id="geometria_geojson" rows="4" required></textarea>

        <label>Geometria KML:</label>
        <textarea name="geometria_kml" rows="3" required></textarea>

        <label>URL de la foto:</label>
        <input type="text" name="foto_url" placeholder="https://...">

        <label>Estat productiu:</label>
        <select name="estat_productiu">
            <option value="Plantat" selected>Plantat</option>
            <option value="Repos">Repos</option>
            <option value="Productiu">Productiu</option>
            <option value="Reconvertit">Reconvertit</option>
        </select>

        <button type="submit" class="btn btn-primary btn-full mt-2">Guardar sector</button>
        <a class="btn btn-ghost btn-full mt-2" href="../PHP/consulta_parcela_sector.php">Tornar a la consulta</a>
    </form>
</div>
</div>
<script>
  document.getElementById('sectorForm').addEventListener('submit', function (event) {
    var geojson = document.getElementById('geometria_geojson').value.trim();
    if (!geojson) {
      event.preventDefault();
      alert("Cal indicar la geometria GeoJSON del sector.");
    }
  });
</script>
</body>
</html>
