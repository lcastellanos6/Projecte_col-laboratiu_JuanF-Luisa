<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Registrar Varietat</title>
    <style>
body { font-family: Arial, sans-serif; background:#f5fff5; padding:20px; }
form { background:white; padding:20px; border-radius:8px; max-width:500px; margin:auto;
       box-shadow:0 2px 6px rgba(0,0,0,0.1); }
label { font-weight:bold; margin-top:10px; display:block; }
input, textarea, button { width:100%; padding:8px; margin-top:5px; border-radius:4px; border:1px solid #ccc; }
button { margin-top:15px; background:#2f7d2f; color:white; padding:10px; border:none;
         border-radius:5px; cursor:pointer; width:100%; }
button:hover { background:#3d9b3d; }
    </style>
</head>
<body>
    <h1>Registrar nova varietat</h1>

    <form action="../PHP/guardar_varietat.php" method="post">
        <label>ID de Espècie:</label>
        <input type="number" name="id_especie" min="1" placeholder="Introdueix l'ID de l'espècie" required>

        <label>Nom científic de la varietat:</label>
        <input type="text" name="nom_cientific" required>

        <label>Nom comú:</label>
        <input type="text" name="nom_comu" required>

        <label>Característiques agronòmiques:</label>
        <textarea name="caracteristiques_agronomiques"></textarea>

        <label>Cicle vegetatiu:</label>
        <textarea name="cicle_vegetatiu"></textarea>

        <label>Requisits de pol·linització:</label>
        <textarea name="requisits_pollinitzacio"></textarea>

        <label>Productivitat mitjana:</label>
        <input type="number" step="0.01" name="productivitat_mitjana">

        <label>Qualitats organolèptiques:</label>
        <textarea name="qualitats_organoleptiques"></textarea>

        <button type="submit">Guardar varietat</button>
    </form>
</body>
</html>
