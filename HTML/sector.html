<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Registre de Sector</title>
    <style>
body { font-family: Arial, sans-serif; background:#f5fff5; padding:20px; }
form { background:white; padding:20px; border-radius:8px; max-width:500px; margin:auto;
       box-shadow:0 2px 6px rgba(0,0,0,0.1); }
label { font-weight:bold; margin-top:10px; display:block; }
input, textarea, button { width:100%; padding:8px; margin-top:5px; border-radius:4px; border:1px solid #ccc; }
button { margin-top:15px; background:#2f7d2f; color:white; padding:10px; border:none;
         border-radius:5px; cursor:pointer; width:100%; }
button:hover { background:#3d9b3d; }
    </style>
</head>
<body>
    <h1>Registrar nou sector</h1>

    <form action="../PHP/guardar_sector.php" method="post">

        <label>Nom del sector:</label>
        <input type="text" name="nom" required>

        <label>Superfície (ha):</label>
        <input type="number" name="superficie" step="0.01">

        <label>Geometria KML:</label>
        <textarea name="geometria_kml" rows="3" required></textarea>

        <label>URL de la foto:</label>
        <input type="text" name="foto_url" placeholder="https://...">

        <label>Estat productiu:</label>
        <select name="estat_productiu">
            <option value="Plantat" selected>Plantat</option>
            <option value="Repos">Repos</option>
            <option value="Productiu">Productiu</option>
            <option value="Reconvertit">Reconvertit</option>
        </select>

        <button type="submit">Guardar Sector</button>
    </form>
</body>
</html>
