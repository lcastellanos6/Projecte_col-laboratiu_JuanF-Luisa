<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Registrar Tipus de Documentació</title>
<style>
body { font-family: Arial, sans-serif; background:#f5fff5; padding:20px; }
form { background:white; padding:20px; border-radius:8px; max-width:500px; margin:auto;
       box-shadow:0 2px 6px rgba(0,0,0,0.1); }
label { font-weight:bold; margin-top:10px; display:block; }
input, textarea, button { width:100%; padding:8px; margin-top:5px; border-radius:4px; border:1px solid #ccc; }
button { margin-top:15px; background:#2f7d2f; color:white; padding:10px; border:none;
         border-radius:5px; cursor:pointer; width:100%; }
button:hover { background:#3d9b3d; }
</style>
</head>
<body>

<h2>Registrar Tipus de Documentació</h2>

<form action="../PHP/guardar_documentacio.php" method="POST" enctype="multipart/form-data">

    <label for="nom_document">Nom del document</label>
    <input type="text" name="nom_document" id="nom_document" required>

    <label for="tipus_document">Tipus de document</label>
    <select name="tipus_document" id="tipus_document" required>
        <option value="DNI">DNI</option>
        <option value="Contracte laboral">Contracte laboral</option>
        <option value="Permís de treball">Permís de treball</option>
        <option value="Certificacio">Certificacio</option>
        <option value="Reconeixement medic">Reconeixement medic</option>
        <option value="Formacio">Formacio</option>
        <option value="Document EPI">Document EPI</option>
        <option value="Altres" selected>Altres</option>
    </select>

    <label for="ruta_url">Adjuntar document (PDF o imatge)</label>
    <input type="file" name="ruta_url" id="ruta_url" accept=".pdf,image/*">

    <label for="data_emissio">Data d'emissió</label>
    <input type="date" name="data_emissio" id="data_emissio">

    <label for="data_caducitat">Data de caducitat</label>
    <input type="date" name="data_caducitat" id="data_caducitat">

    <label for="observacions">Descripció (opcional)</label>
    <textarea name="observacions" id="observacions"></textarea>

    <label for="dni">DNI</label>
    <input type="text" name="dni" id="dni" required>

    <button type="submit">Guardar Tipus de Document</button>

</form>

</body>
</html>
