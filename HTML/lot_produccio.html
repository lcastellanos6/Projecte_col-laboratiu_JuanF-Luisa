<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Afegir Lot</title>
<style>
body { font-family: Arial, sans-serif; background:#f5fff5; padding:20px; }
form { background:white; padding:20px; border-radius:8px; max-width:500px; margin:auto;
       box-shadow:0 2px 6px rgba(0,0,0,0.1); }
label { font-weight:bold; margin-top:10px; display:block; }
input, select, textarea, button {
    width:100%; padding:8px; margin-top:5px;
    border-radius:4px; border:1px solid #ccc;
}
button {
    margin-top:15px; background:#2f7d2f; color:white;
    padding:10px; border:none; border-radius:5px; cursor:pointer;
}
button:hover { background:#3d9b3d; }
</style>
</head>
<body>

<h2>Registrar Nou Lot</h2>

<form action="../PHP/guardar_lot_produccio.php" method="post">

    <label>ID Collita *</label>
    <input type="number" name="collita_id" required>

    <label>Codi Lot *</label>
    <input type="text" name="codi_lot" required>

    <label>Data de Creació *</label>
    <input type="date" name="data_creacio" required>

    <label>Quantitat *</label>
    <input type="number" step="0.01" name="quantitat" required>

    <label>Unitat *</label>
    <select name="unitat" required>
        <option value="kg">Kg</option>
        <option value="caixa">Caixa</option>
        <option value="bin">Bin</option>
    </select>

    <label>Qualitat</label>
    <input type="text" name="qualitat">

    <label>Estat *</label>
    <select name="estat" required>
        <option value="Emmagatzemat">Emmagatzemat</option>
        <option value="En transport">En transport</option>
        <option value="Venut">Venut</option>
    </select>

    <label>ID Client</label>
    <input type="number" name="id_client">

    <label>URL del QR</label>
    <input type="text" name="qr_url">

    <button type="submit">Guardar Lot</button>

</form>

</body>
</html>
