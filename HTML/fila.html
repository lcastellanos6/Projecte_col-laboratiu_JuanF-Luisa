<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Registrar Fila</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">
<div class="page-header">
  <h1>Registrar nova Fila</h1>
</div>

<div class="panel">
<form action="../PHP/guardar_fila.php" method="post">

    <label>Plantació (ID):</label>
    <input type="number" name="id_increment" required placeholder="ID de la plantació">

    <label>Número de fila:</label>
    <input type="number" name="numero_fila" required placeholder="Número de la fila">

    <button type="submit" class="btn btn-primary btn-full mt-2">Guardar Fila</button>
</form>
</div>
</div>
</body>
</html>
