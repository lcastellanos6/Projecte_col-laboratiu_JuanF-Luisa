<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Afegir Previsió de Producció</title>
<style>
body { font-family: Arial, sans-serif; background:#f5fff5; padding:20px; }
form { background:white; padding:20px; border-radius:8px; max-width:500px; margin:auto;
       box-shadow:0 2px 6px rgba(0,0,0,0.1); }
label { font-weight:bold; margin-top:10px; display:block; }
input, select, button { width:100%; padding:8px; margin-top:5px; border-radius:4px; border:1px solid #ccc; }
button { margin-top:15px; background:#2f7d2f; color:white; padding:10px; border:none; border-radius:5px; cursor:pointer; }
button:hover { background:#3d9b3d; }
</style>
</head>
<body>

<h2>Registrar Previsió de Producció</h2>

<form action="../PHP/guardar_previsio_collita.php" method="post">

    <label>ID Parcela *</label>
    <input type="number" name="id_parcela" required>

    <label>ID Varietat *</label>
    <input type="number" name="id_varietat" required>

    <label>Campanya Any *</label>
    <input type="number" name="campanya_any" min="2000" max="2100" required>

    <label>Estimació Producció</label>
    <input type="number" step="0.01" name="estimacio_produccio">

    <label>Unitat *</label>
    <select name="unitat" required>
        <option value="kg">Kg</option>
        <option value="Tn">Tn</option>
    </select>

    <label>Data Estimada de Collita</label>
    <input type="date" name="data_estimada_collita">

    <label>Model Predictiu</label>
    <input type="text" name="model_predictiu">

    <button type="submit">Guardar Previsió</button>

</form>

</body>
</html>
