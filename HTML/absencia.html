<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Gestió d'Absències</title>
<style>
body { font-family: Arial, sans-serif; background:#f5fff5; padding:20px; }
form { background:white; padding:20px; border-radius:8px; max-width:500px; margin:auto;
       box-shadow:0 2px 6px rgba(0,0,0,0.1); }
label { font-weight:bold; margin-top:10px; display:block; }
input, select, textarea { width:100%; padding:8px; margin-top:5px; border-radius:4px;
                          border:1px solid #ccc; }
button { margin-top:15px; background:#2f7d2f; color:white; padding:10px; border:none;
         border-radius:5px; cursor:pointer; width:100%; }
button:hover { background:#3d9b3d; }
</style>
</head>
<body>

<h2>Registrar Absència</h2>

<form action="../PHP/guardar_absencia.php" method="POST" enctype="multipart/form-data">

    <label for="id_treballador">Treballador (ID)</label>
    <input type="number" name="id_treballador" required>

    <label for="tipus">Tipus d'absència</label>
    <select name="tipus" required>
        <option value="Vacances">Vacances</option>
        <option value="Permis">Permis</option>
        <option value="Baixa">Baixa</option>
        <option value="Altres">Altres</option>
    </select>

    <label for="data_inici">Data d'inici</label>
    <input type="date" name="data_inici" required>

    <label for="data_fi">Data de finalització</label>
    <input type="date" name="data_fi" required>

    <label for="justificacio_url">Justificant (PDF o imatge)</label>
    <input type="file" name="justificacio_url">

    <label for="observacions">Observacions</label>
    <textarea name="observacions"></textarea>

    <button type="submit">Guardar Absència</button>

</form>

</body>
</html>
